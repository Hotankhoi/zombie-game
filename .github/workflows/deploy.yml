name: Đưa game lên GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx vite build
        env:
          # https://<app>.metered.live/api/v1/turn/credentials?apiKey=... (TURN miễn phí, xem net/ice.ts)
          VITE_TURN_URL: ${{ secrets.VITE_TURN_URL }}
          # wss://zombie-relay.<tên>.workers.dev (relay dự phòng, xem docs/relay.md). Rỗng = tắt relay.
          VITE_RELAY_URL: ${{ secrets.VITE_RELAY_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
