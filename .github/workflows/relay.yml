name: Relay Cloudflare (dự phòng khi WebRTC không nối được)

# Deploy relay/ lên Cloudflare Workers + Durable Objects (gói Free) mỗi khi relay thay đổi trên main.
# Cần 2 secret: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (hướng dẫn: docs/relay.md).
# Chưa có secret → bỏ qua bước deploy, workflow vẫn xanh.

on:
  push:
    branches: [main]
    paths: ['relay/**', 'net/relayProtocol.ts', '.github/workflows/relay.yml']
  pull_request:
    paths: ['relay/**', 'net/relayProtocol.ts', '.github/workflows/relay.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Kiểm tra đóng gói (không deploy)
        run: npx wrangler deploy --dry-run --outdir dist
      - name: Thiếu secret → bỏ qua deploy
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::Chưa có CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID — bỏ qua deploy relay."
      - name: Deploy lên Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay
          command: deploy
